# NOTE: This file is automatically synchronized from Patina DevOps. Update the original file there
#       instead of the file in this repo.
#
# - Patina DevOps Repo: https://github.com/OpenDevicePartnership/patina-devops
# - File Sync Settings: https://github.com/OpenDevicePartnership/patina-devops/blob/main/.sync/Files.yml

[config]
default_to_workspace = false

[env]
NO_STD_FLAGS = "--profile ${RUSTC_PROFILE} --timings"
STD_FLAGS = "--profile ${RUSTC_PROFILE} --features std"
# Note: `--profile test` has been set here in the past. Cargo already defaults to test builds
# with the test profile, so it is removed. cargo-llvm-cov will forward it to `cargo nextest run`
# where `--profile` is used to incorrectly select a nextest config profile (not a Cargo build profile).
# `--workspace` is intentionally not part of this value. It is supplied separately by the
# `cov-workspace-flag` task, which omits it when the command line provides arguments, because
# `--workspace` overrides `-p`.
COV_FLAGS = { value = "--ignore-filename-regex .*test.*", condition = { env_not_set = ["COV_FLAGS"] } }
RUSTDOCFLAGS = "-D warnings -D missing_docs"
# Selects the nextest `ci` profile (defined in .config/nextest.toml) automatically when the `CI`
# variable is set (e.g. GitHub Actions sets this for every job).
# `NEXTEST_PROFILE` is read natively by `cargo nextest run` and by `cargo llvm-cov ... nextest`.
# Note: Passing `--profile`/`-P` explicitly on the command line takes precedence over this env var.
NEXTEST_PROFILE = { value = "ci", condition = { env_set = ["CI"] } }

[env.development]
RUSTC_PROFILE = "dev"

[env.release]
RUSTC_PROFILE = "release"

[tasks.install-tools]
description = """Installs the project tools pinned in the `[tools]` section of
`rust-toolchain.toml` at their specified versions. Each tool is installed with
`cargo binstall`, falling back to `cargo install` when a prebuilt binary is not
available. CI also installs and tests the tools in this section.

`cargo-binstall` (https://github.com/cargo-bins/cargo-binstall) is installed
automatically with `cargo install` when it is not already present.

Example:
    `cargo make install-tools`
"""
clear = true
install_crate = false
script_runner = "@duckscript"
script = '''
# cargo-binstall is used to install tools.
binstall_path = which cargo-binstall
if is_empty ${binstall_path}
    echo "==> cargo-binstall not found. Installing it with cargo install..."
    exec --fail-on-error cargo install cargo-binstall
end

toolchain_file = readfile rust-toolchain.toml
lines = split ${toolchain_file} "\n"

# Track whether the current line is inside the `[tools]` section. Parsing runs
# from the `[tools]` header until the next section header.
in_tools = set false
for line in ${lines}
    trimmed = trim ${line}
    is_section = starts_with ${trimmed} "["
    if ${is_section}
        if eq ${trimmed} "[tools]"
            in_tools = set true
        else
            in_tools = set false
        end
    elseif ${in_tools}
        is_comment = starts_with ${trimmed} "#"
        is_blank = is_empty ${trimmed}
        has_assignment = contains ${trimmed} "="
        # Only process `name = "version"` lines.
        if not ${is_blank}
            if not ${is_comment}
                if ${has_assignment}
                    kv = split ${trimmed} "="
                    name = array_get ${kv} 0
                    name = trim ${name}

                    version = array_get ${kv} 1
                    version_parts = split ${version} "\""
                    version = array_get ${version_parts} 1

                    result = exec cargo binstall -y ${name} --version ${version}
                    output = set "${result.stdout}${result.stderr}"
                    if not eq ${result.code} "0"
                        echo "  building ${name} ${version} from source (no prebuilt binary)..."
                        result = exec cargo install ${name} --version ${version}
                        output = set "${result.stdout}${result.stderr}"
                    end

                    if not eq ${result.code} "0"
                        echo "  FAILED       ${name} ${version}"
                        echo ${output}
                        exit 1
                    end

                    already = contains ${output} "already installed"
                    if ${already}
                        echo "  up-to-date   ${name} ${version}"
                    else
                        echo "  installed    ${name} ${version}"
                    end
                end
            end
        end
    end
end
'''

[tasks.build]
description = """Builds a single rust package with the standard library.

Arguments are forwarded to `cargo build` unchanged, so any flag `cargo build`
accepts can be used.

Customizations:
    -p [development|release]: Builds in debug or release. Default: development
    -e FEATURES=[feature,...]: Builds with the specified features. Default: none

Example:
    `cargo make build`
    `cargo make -p release build`
    `cargo make build -p patina`
    `cargo make -e FEATURES=feature1,feature2 build`
"""
alias = "build-std"

[tasks.build-std]
description = """Builds crates in the repository with the standard library, and their examples.

Arguments are forwarded to `cargo build` unchanged, so any flag `cargo build`
accepts can be used.

Customizations:
    -p [development|release]: Builds in debug or release. Default: development
    -e FEATURES=[feature,...]: Builds with the specified features. Default: none

Example:
    `cargo make build-std`
    `cargo make -p release build-std`
    `cargo make build-std -p patina -p patina_dxe_core`
"""
clear = true
command = "cargo"
args = ["build", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(STD_FLAGS, )", "--examples"]
dependencies = ["build-lib"]

[tasks.build-lib]
description = """Builds crates in the repository with the standard library.

Arguments are forwarded to `cargo build` unchanged, so any flag `cargo build`
accepts can be used.

Customizations:
    -p [development|release]: Builds in debug or release. Default: development
    -e FEATURES=[feature,...]: Builds with the specified features. Default: none

Example:
    `cargo make build-lib`
    `cargo make -p release build-lib`
    `cargo make build-lib -p patina`
"""
clear = true
command = "cargo"
args = ["build", "--all-features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(STD_FLAGS, )"]

[tasks.check_code_x64]
description = "Checks rust code for x64 build errors with results."
private = true
command = "cargo"
args = ["check", "--target", "x86_64-unknown-uefi", "--features", "ci_features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(NO_STD_FLAGS, )",]

[tasks.check_code_aarch64]
description = "Checks rust code for aarch64 build errors with results."
private = true
command = "cargo"
args = ["check", "--target", "aarch64-unknown-uefi", "--features", "ci_features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(NO_STD_FLAGS, )",]

[tasks.check_tests]
description = "Checks rust test code for build errors with results."
private = true
command = "cargo"
args = ["nextest", "run", "--no-run", "--all-targets", "--all-features", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.check-no-default-features-code]
description = "Checks rust code compiles without default features."
private = true
command = "cargo"
args = ["check", "--no-default-features", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.check-no-default-features-tests]
description = "Checks rust test code compiles without default features."
private = true
command = "cargo"
args = ["nextest", "run", "--no-run", "--no-default-features", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.check-no-default-features]
description = "Checks rust code and tests compile without default features to catch feature-gate regressions."
clear = true
run_task = [{ name = ["check-no-default-features-code", "check-no-default-features-tests"], parallel = true }]

[tasks.check]
description = "Checks rust code for errors. Arguments are forwarded to `cargo check`/`cargo nextest`. Example `cargo make check` or `cargo make check -p patina`"
clear = true
run_task = [{ name = ["check_code_x64", "check_code_aarch64", "check_tests"], parallel = true }]

[tasks.patina-test]
# The feature is selected as `patina_test/test-runner` rather than a bare `test-runner`. A bare
# feature name must be declared by every selected package, so `-p <crate>` failed for every crate
# except `patina_test` itself. The `<package>/<feature>` form only requires `patina_test` to be in
# the dependency graph of the selected packages, which is already true for any crate that writes
# `#[patina_test]` tests.
description = "Builds crates with Patina tests enabled. Arguments are forwarded to `cargo build`. Example `cargo make patina-test` or `cargo make patina-test -p patina_dxe_core`"
clear = true
command = "cargo"
args = ["build", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(STD_FLAGS, )", "--features", "patina_test/test-runner"]

[tasks.generate-lockfile]
description = "Generate Cargo.lock file."
private = true
command = "cargo"
args = ["generate-lockfile"]

[tasks.llvm-cov-clean]
description = "Clean coverage data"
private = true
install_crate = false
command = "cargo"
args = ["llvm-cov", "clean", "--workspace"]

[tasks.test]
description = "Runs tests via cargo-nextest. Arguments are forwarded to `cargo nextest run`. Example `cargo make test` or `cargo make test -p patina --no-capture`. In CI, also runs a second pass with the `ci_features` feature enabled to ensure tests do not depend on it being enabled."
clear = true
dependencies = ["test-default", "test-ci-features"]

[tasks.test-default]
description = "Runs tests via cargo-nextest with default features."
private = true
command = "cargo"
args = ["nextest", "run", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.test-ci-features]
description = "Runs tests via cargo-nextest with the `ci_features` feature enabled. Only runs when the `CI` environment variable is set."
private = true
condition = { env_set = ["CI"] }
command = "cargo"
args = ["nextest", "run", "--features", "ci_features", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.test-ignored]
description = "Runs ignored tests with native cargo test behavior. Arguments are forwarded to `cargo test`. Example `cargo make test-ignored` or `cargo make test-ignored -p patina`"
clear = true
command = "cargo"
args = ["test", "--lib", "--tests", "--examples", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--", "--ignored"]

[tasks.cov-workspace-flag]
description = """Sets `COV_WORKSPACE` to `--workspace` only when no arguments were given on the
command line. `--workspace` overrides `-p`, so it is dropped whenever any argument is given
(for example `cargo make coverage -p patina`)."""
private = true
script_runner = "@duckscript"
script = '''
args = get_env CARGO_MAKE_TASK_ARGS
if is_empty ${args}
    set_env COV_WORKSPACE "--workspace"
else
    set_env COV_WORKSPACE ""
end
'''

[tasks.test-cov]
description = "Run tests and collect coverage data without generating reports. Arguments are forwarded to `cargo llvm-cov nextest`."
install_crate = false
clear = true
# `coverage_attribute` is deliberately excluded from the default allow-features in
# .cargo/config.toml so ungated `#[coverage(off)]` fails to compile. Coverage runs set the
# `coverage` cfg (set by cargo-llvm-cov), which needs the feature, so re-add it here.
# Note: RUSTFLAGS replaces build.rustflags.
env = { RUSTFLAGS = "-Z allow-features=c_variadic,allocator_api,coverage_attribute" }
# cargo-llvm-cov is not currently supported on Windows ARM64 hosts.
# See:
#   - https://github.com/taiki-e/cargo-llvm-cov/issues/436
#   - https://github.com/rust-lang/rust/issues/150123
script_runner = "@duckscript"
condition_script = ['''
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
if eq ${target} "aarch64-pc-windows-msvc"
    echo "cargo-llvm-cov is not supported on aarch64-pc-windows-msvc. Skipping test-cov."
    exit 1
end
''']
command = "cargo"
args = ["llvm-cov", "@@split(COV_WORKSPACE, )", "@@split(COV_FLAGS, )", "--no-report", "nextest", "@@split(CARGO_MAKE_TASK_ARGS,;)"]
dependencies = ["cov-workspace-flag", "llvm-cov-clean"]

[tasks.test-cov-fallback]
description = "Runs tests without coverage instrumentation on hosts where test-cov is skipped (currently just aarch64-pc-windows-msvc). Arguments are forwarded to `cargo nextest run`."
clear = true
script_runner = "@duckscript"
condition_script = ['''
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
if not eq ${target} "aarch64-pc-windows-msvc"
    exit 1
end
''']
command = "cargo"
args = ["nextest", "run", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.test-asan]
description = "Run tests with AddressSanitizer enabled. Example `cargo make test-asan`. Use `cargo make test-asan --print-dll-path` to print the ASan runtime DLL directory."
clear = true
script_runner = "@duckscript"
script = '''
os = os_family

if eq ${os} "windows"
    # ASan testing is only supported on Windows x64.
    # https://learn.microsoft.com/cpp/sanitizers/asan
    arch = get_env PROCESSOR_ARCHITECTURE
    if not eq ${arch} "AMD64"
        echo "test-asan is only supported on Windows x64. Detected arch: ${arch}. Skipping."
        exit 0
    end

    # The ASan runtime DLL (clang_rt.asan_dynamic-x86_64.dll) from the
    # MSVC toolchain must be on PATH for ASan-instrumented test binaries to run.
    #
    # Resolve the VC toolset path per vswhere docs:
    # https://github.com/microsoft/vswhere/wiki/Find-VC
    program_files_x86 = get_env "ProgramFiles(x86)"
    vswhere = set "${program_files_x86}/Microsoft Visual Studio/Installer/vswhere.exe"
    output = exec "${vswhere}" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
    install_dir = trim ${output.stdout}
    version = readfile "${install_dir}/VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt"
    version = trim ${version}
    asan_dll_path = set "${install_dir}/VC/Tools/MSVC/${version}/bin/HostX64/x64"

    args = get_env CARGO_MAKE_TASK_ARGS
    if contains "${args}" "--print-dll-path"
        asan_dll_path = replace ${asan_dll_path} / \\
        echo "${asan_dll_path}"
        exit 0
    end

    current_path = get_env PATH
    set_env PATH "${asan_dll_path};${current_path}"
elseif eq ${os} "linux"
    # On Linux, the ASan runtime is resolved automatically by the linker.
    noop
else
    echo "test-asan is not supported on ${os}. Skipping."
    exit 0
end

set_env RUSTFLAGS "-Zsanitizer=address"
set_env RUSTDOCFLAGS "-Zsanitizer=address"
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
exec --fail-on-error cargo nextest run --target ${target} --workspace --features std
# nextest cannot run doctests, so run them separately to keep ASan coverage of doctests too.
exec --fail-on-error cargo test --doc --target ${target} --workspace --features std
'''

[tasks.coverage-lcov]
description = "Generate an LCOV coverage report from collected data."
install_crate = false
clear = true
# cargo-llvm-cov is not currently supported on Windows ARM64 hosts.
# See:
#   - https://github.com/taiki-e/cargo-llvm-cov/issues/436
#   - https://github.com/rust-lang/rust/issues/150123
script_runner = "@duckscript"
condition_script = ['''
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
if eq ${target} "aarch64-pc-windows-msvc"
    echo "cargo-llvm-cov is not supported on aarch64-pc-windows-msvc. Skipping coverage-lcov."
    exit 1
end
''']
command = "cargo"
args = ["llvm-cov", "report", "--lcov", "--output-path", "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/lcov.info"]

[tasks.coverage-html]
description = "Generate an HTML coverage report from collected data."
install_crate = false
clear = true
# cargo-llvm-cov is not currently supported on Windows ARM64 hosts.
# See:
#   - https://github.com/taiki-e/cargo-llvm-cov/issues/436
#   - https://github.com/rust-lang/rust/issues/150123
script_runner = "@duckscript"
condition_script = ['''
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
if eq ${target} "aarch64-pc-windows-msvc"
    echo "cargo-llvm-cov is not supported on aarch64-pc-windows-msvc. Skipping coverage-html."
    exit 1
end
''']
command = "cargo"
args = ["llvm-cov", "report", "--html", "--output-dir", "${CARGO_MAKE_WORKSPACE_WORKING_DIRECTORY}/target/coverage"]

[tasks.coverage]
description = "Build and run all tests and calculate coverage (runs test once and generates LCOV and HTML reports). Arguments are forwarded to `cargo llvm-cov nextest`. Example `cargo make coverage -p patina`. In CI, also runs a second pass with the `ci_features` feature enabled (outside of coverage collection) since only `cargo make coverage` is run in CI."
dependencies = ["test-cov", "test-cov-fallback", "coverage-lcov", "coverage-html", "test-ci-features"]
clear = true

[tasks.build-aarch64]
description = "Builds crates in the repository for AARCH64. Arguments are forwarded to `cargo build`. Example `cargo make build-aarch64 -p patina_dxe_core`"
clear = true
command = "cargo"
args = ["build", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--target", "aarch64-unknown-uefi", "@@split(NO_STD_FLAGS, )", ]

[tasks.build-x64]
description = "Builds crates in the repository for X64. Arguments are forwarded to `cargo build`. Example `cargo make build-x64 -p patina_dxe_core`"
clear = true
command = "cargo"
args = ["build", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--target", "x86_64-unknown-uefi", "@@split(NO_STD_FLAGS, )", ]
script_runner = "@duckscript"
condition_script = ['''
target = get_env CARGO_MAKE_RUST_TARGET_TRIPLE
if eq ${target} "aarch64-pc-windows-msvc"
    echo "Cross-compiling for x86_64-unknown-uefi from aarch64-pc-windows-msvc is skipped to save build time on Windows ARM64 hosts."
    exit 1
end
''']

[tasks.doc]
description = "Builds all rust documentation in the workspace. Arguments are forwarded to `cargo doc`. Example `cargo make doc` or `cargo make doc -p patina`"
clear = true
command = "cargo"
args = ["doc", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--no-deps"]

[tasks.doc-open]
description = "Builds all rust documentation in the workspace and opens the documentation. Arguments are forwarded to `cargo doc`. Example `cargo make doc-open` or `cargo make doc-open -p patina`"
clear = true
command = "cargo"
args = ["doc", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--open"]

[tasks.clippy]
description = "Run cargo clippy for the host target and both UEFI cross-compilation targets. Arguments are forwarded to `cargo clippy`."
clear = true
run_task = [{ name = ["clippy-x64", "clippy-aarch64", "clippy-std"], parallel = true }]

[tasks.clippy-x64]
description = "Run cargo clippy for x86_64-unknown-uefi."
private = true
command = "cargo"
args = ["clippy", "--target", "x86_64-unknown-uefi", "--features", "ci_features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(NO_STD_FLAGS, )", "--", "-D", "warnings"]

[tasks.clippy-aarch64]
description = "Run cargo clippy for aarch64-unknown-uefi."
private = true
command = "cargo"
args = ["clippy", "--target", "aarch64-unknown-uefi", "--features", "ci_features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(NO_STD_FLAGS, )", "--", "-D", "warnings"]

[tasks.clippy-std]
description = "Run cargo clippy for std."
private = true
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "--", "-D", "warnings"]

[tasks.fmt-all-flag]
description = """Sets `FMT_ALL` to `--all` only when no arguments were given on the command line.
`--all` overrides `-p`, so it is dropped whenever any argument is given (for example
`cargo make fmt -p patina`)."""
private = true
script_runner = "@duckscript"
script = '''
args = get_env CARGO_MAKE_TASK_ARGS
if is_empty ${args}
    set_env FMT_ALL "--all"
else
    set_env FMT_ALL ""
end
'''

[tasks.fmt]
description = "Run cargo format. Arguments are forwarded to `cargo fmt`. Example `cargo make fmt` or `cargo make fmt -p patina`"
clear = true
command = "cargo"
args = ["fmt", "@@split(FMT_ALL, )", "@@split(CARGO_MAKE_TASK_ARGS,;)"]
dependencies = ["fmt-all-flag"]

[tasks.fmt-check]
description = "Check cargo format without modifying files. Arguments are forwarded to `cargo fmt`. Example `cargo make fmt-check` or `cargo make fmt-check -p patina`"
clear = true
command = "cargo"
args = ["fmt", "@@split(FMT_ALL, )", "--check", "@@split(CARGO_MAKE_TASK_ARGS,;)"]
dependencies = ["fmt-all-flag"]

[tasks.doc-test]
description = "Run documentation tests. Arguments are forwarded to `cargo test`."
clear = true
command = "cargo"
args = ["test", "--doc", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.clean-mdbook-deps]
description = """Removes the `target/mdbook/` directory to clean up old rlibs."""
clear = true
script_runner = "@duckscript"
script = '''
mdbook_target = set "target/mdbook"
exists = is_path_exists ${mdbook_target}
if ${exists}
    echo Removing stale ${mdbook_target} directory...
    rm -r ${mdbook_target}
end
'''

[tasks.build-mdbook-deps]
description = """Builds workspace libraries with the `mdbook` profile.
This is a prerequisite for `cargo make test-mdbook`."""
clear = true
env = { RUSTC_PROFILE = "mdbook" }
command = "cargo"
args = ["build", "--all-features", "@@split(CARGO_MAKE_TASK_ARGS,;)", "@@split(STD_FLAGS, )"]
dependencies = ["clean-mdbook-deps"]

[tasks.test-mdbook]
description = """Builds the mdbook and runs all of its embedded doctests with
`mdbook test`. Uses the workspace toolchain (from `rust-toolchain.toml`) so the
doctests link against rlibs built by the same compiler, and points `mdbook test`
to the mdbook profile `target/mdbook/deps/` directory produced by `build-mdbook-deps`.
"""
clear = true
env = { RUSTC_BOOTSTRAP = "1" }
script_runner = "@duckscript"
script = '''
toolchain_file = readfile rust-toolchain.toml
channel = set "stable"
found = set false
lines = split ${toolchain_file} "\n"
for line in ${lines}
    trimmed = trim ${line}
    starts = starts_with ${trimmed} "channel"
    # Only use the first `channel` line (the one under `[toolchain]`).
    if ${starts}
        if not ${found}
            parts = split ${trimmed} "\""
            channel = array_get ${parts} 1
            found = set true
        end
    end
end
exec --fail-on-error mdbook build docs
exec --fail-on-error rustup run ${channel} mdbook test docs -L target/mdbook/deps
'''
dependencies = ["build-mdbook-deps"]

[tasks.serve-mdbook]
description = """Serves the mdbook at http://localhost:3000 with live reload.
`mdbook serve` rebuilds on source changes. It does not run the embedded doctests
(use `cargo make test-mdbook` for that)."""
clear = true
command = "mdbook"
args = ["serve", "docs", "--open"]

[tasks.cspell]
description = "Run cspell for spell checking." # npm install -g cspell@latest
script = "cspell --quiet  --no-progress --no-summary  --dot --gitignore -e \"{.git/**,.github/**,.vscode/**}\" ."

[tasks.deny]
description = "Run cargo deny. Arguments are forwarded to `cargo deny check`."
install_crate = false
clear = true
command = "cargo"
args = ["deny", "check", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.bench]
description = "Run cargo bench. Arguments are forwarded to `cargo bench`."
clear = true
command = "cargo"
args = ["bench", "@@split(CARGO_MAKE_TASK_ARGS,;)"]

[tasks.vet]
description = "Run cargo vet. Arguments are forwarded to `cargo vet`."
install_crate = false
clear = true
dependencies = ["generate-lockfile"]
command = "cargo"
args = ["vet", "--locked", "@@split(CARGO_MAKE_TASK_ARGS,;)"]
ignore_errors = false

[tasks.all-preflight]
private = true
run_task = [{ name = ["fmt-check", "deny", "cspell"], parallel = true }]

[tasks.all]
description = "Run all tasks for PR readiness. This task takes no arguments; any arguments given are forwarded to every sub-task."
env = { CARGO_INCREMENTAL = "0" }
run_task = { name = [
        "all-preflight",
        "clippy",
        "check-no-default-features",
        "build",
        "build-x64",
        "build-aarch64",
        "patina-test",
        "coverage",
        "doc-test",
        "doc",
        "test-ignored",
        "test-mdbook",
    ] }
