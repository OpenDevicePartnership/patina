[package]
name = "patina_internal_cpu"
version.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme = "README.md"
description = "CPU support."
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
features = ["std"]

[dependencies]
log = { workspace = true }
patina = { workspace = true, features = ["core"] }
spin = { workspace = true, features = ["rwlock"] }
patina_paging = { workspace = true }
cfg-if = { workspace = true }
patina_stacktrace = { workspace = true }
mockall = { workspace = true, optional = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }

[target.'cfg(all(target_arch="x86_64"))'.dependencies]
patina_mtrr = { workspace = true }

[target.'cfg(all(target_arch="aarch64"))'.dependencies]
arm-gic = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
patina = { workspace = true, features = ["mockall"] }
patina_paging = { workspace = true, features = ["mockall"] }
serial_test = { workspace = true }

[target.'cfg(all(target_arch="x86_64"))'.dev-dependencies]
patina_mtrr = { workspace = true, features = ["mockall"] }

[features]
std = []
alloc = ["patina/alloc"]
mockall = ["dep:mockall", "std"]
# Read the SMRAM save state with the AMD64 layout. The Intel x64 layout is used otherwise.
save_state_amd = []
# All non-std features to test in CI
ci_features = []
