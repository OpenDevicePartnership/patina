<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" font-family="monospace" font-size="13">
  <title>MMRAM page states</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="250" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="230" fill="#fff3cc"/>
  <text x="20" y="230" text-anchor="start" fill="#7a5a00" font-weight="bold">Ring 0: the page allocator in mm_supervisor.efi</text>
  <rect x="30" y="110" width="190" height="70" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="125" y="133" text-anchor="middle" fill="#222" font-weight="bold">Supervisor page</text>
  <text x="125" y="149" text-anchor="middle" fill="#222">supervisor-only,</text>
  <text x="125" y="165" text-anchor="middle" fill="#222">writable, no execute</text>
  <rect x="330" y="110" width="140" height="70" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="400" y="141" text-anchor="middle" fill="#222" font-weight="bold">Free</text>
  <text x="400" y="157" text-anchor="middle" fill="#222">not allocated</text>
  <rect x="580" y="110" width="190" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="675" y="133" text-anchor="middle" fill="#222" font-weight="bold">User page</text>
  <text x="675" y="149" text-anchor="middle" fill="#222">user-accessible,</text>
  <text x="675" y="165" text-anchor="middle" fill="#222">writable, no execute</text>
  <circle cx="400" cy="50" r="7" fill="#222"/>
  <polyline points="400,57 400,110" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="84" text-anchor="start" fill="#555" font-size="11">MMRAM region</text>
  <circle cx="125" cy="50" r="7" fill="#222"/>
  <polyline points="125,57 125,110" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="133" y="84" text-anchor="start" fill="#555" font-size="11">marked allocated by the producer</text>
  <polyline points="330,128 220,128" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="122" text-anchor="middle" fill="#555" font-size="11">allocate</text>
  <polyline points="220,162 330,162" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="156" text-anchor="middle" fill="#555" font-size="11">scrub, unmap</text>
  <polyline points="470,128 580,128" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="122" text-anchor="middle" fill="#555" font-size="11">allocate, zero</text>
  <polyline points="580,162 470,162" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="525" y="156" text-anchor="middle" fill="#555" font-size="11">scrub, unmap</text>
</svg>
