<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" font-family="monospace" font-size="13">
  <title>Component and driver dispatch</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="450" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="430" fill="#f0f0f0"/>
  <text x="20" y="430" text-anchor="start" fill="#555" font-weight="bold">Ring 3: mm_user_core.efi, BSP</text>
  <rect x="30" y="25" width="350" height="60" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="205" y="51" text-anchor="middle" fill="#222" font-weight="bold">1. First synchronous MMI with</text>
  <text x="205" y="67" text-anchor="middle" fill="#222">MM_DISPATCH_EVENT_GROUP_GUID</text>
  <rect x="420" y="25" width="350" height="60" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="595" y="51" text-anchor="middle" fill="#222" font-weight="bold">2. Unregister the</text>
  <text x="595" y="67" text-anchor="middle" fill="#222">dispatch event handler</text>
  <polyline points="380,55 420,55" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="115" width="760" height="120" rx="5" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="28" y="131" text-anchor="start" fill="#444" font-size="11">Components</text>
  <rect x="30" y="145" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="115" y="160" text-anchor="middle" fill="#222" font-weight="bold">3. Apply configs,</text>
  <text x="115" y="176" text-anchor="middle" fill="#222">services and</text>
  <text x="115" y="192" text-anchor="middle" fill="#222">components; parse</text>
  <text x="115" y="208" text-anchor="middle" fill="#222">guided HOBs</text>
  <rect x="220" y="145" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="305" y="168" text-anchor="middle" fill="#222" font-weight="bold">4. Run until none</text>
  <text x="305" y="184" text-anchor="middle" fill="#222">can run (configs</text>
  <text x="305" y="200" text-anchor="middle" fill="#222">unlocked)</text>
  <rect x="410" y="145" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="495" y="176" text-anchor="middle" fill="#222" font-weight="bold">5. Lock the</text>
  <text x="495" y="192" text-anchor="middle" fill="#222">configs</text>
  <rect x="600" y="145" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="685" y="168" text-anchor="middle" fill="#222" font-weight="bold">6. Run until none</text>
  <text x="685" y="184" text-anchor="middle" fill="#222">can run (configs</text>
  <text x="685" y="200" text-anchor="middle" fill="#222">locked)</text>
  <polyline points="200,180 220,180" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="390,180 410,180" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="580,180 600,180" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="595,85 595,100 115,100 115,145" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="255" width="760" height="140" rx="5" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="28" y="271" text-anchor="start" fill="#444" font-size="11">MM drivers</text>
  <rect x="30" y="285" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="115" y="308" text-anchor="middle" fill="#222" font-weight="bold">7. Any pending</text>
  <text x="115" y="324" text-anchor="middle" fill="#222">driver with its</text>
  <text x="115" y="340" text-anchor="middle" fill="#222">depex satisfied?</text>
  <rect x="220" y="285" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="305" y="308" text-anchor="middle" fill="#222" font-weight="bold">8. Order the pass:</text>
  <text x="305" y="324" text-anchor="middle" fill="#222">BEFORE, target,</text>
  <text x="305" y="340" text-anchor="middle" fill="#222">AFTER</text>
  <rect x="410" y="285" width="170" height="70" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="495" y="316" text-anchor="middle" fill="#222" font-weight="bold">9. Call the driver</text>
  <text x="495" y="332" text-anchor="middle" fill="#222">entry points</text>
  <rect x="600" y="285" width="170" height="70" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="685" y="316" text-anchor="middle" fill="#222" font-weight="bold">10. Log what was</text>
  <text x="685" y="332" text-anchor="middle" fill="#222">not dispatched</text>
  <polyline points="685,215 685,245 115,245 115,285" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="200,320 220,320" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="210" y="312" text-anchor="middle" fill="#2d6a4f" font-size="11">yes</text>
  <polyline points="390,320 410,320" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="495,355 495,370 140,370 140,355" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="366" text-anchor="middle" fill="#555" font-size="11">next pass</text>
  <polyline points="60,355 60,386 685,386 685,355" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="68" y="380" text-anchor="start" fill="#555" font-size="11">no</text>
</svg>
