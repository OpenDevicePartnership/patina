<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="monospace" font-size="13">
  <title>An UNBLOCK_MEM request</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="100" fill="#f0f0f0"/>
  <text x="20" y="100" text-anchor="start" fill="#555" font-weight="bold">Outside MM</text>
  <rect x="10" y="110" width="780" height="320" fill="#fff3cc"/>
  <text x="20" y="420" text-anchor="start" fill="#7a5a00" font-weight="bold">Ring 0: mm_supervisor.efi, BSP</text>
  <line x1="10" y1="110" x2="790" y2="110" stroke="#999" stroke-dasharray="6 4"/>
  <rect x="30" y="25" width="270" height="60" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="165" y="43" text-anchor="middle" fill="#222" font-weight="bold">Caller outside MM</text>
  <text x="165" y="59" text-anchor="middle" fill="#222">UNBLOCK_MEM on the</text>
  <text x="165" y="75" text-anchor="middle" fill="#222">supervisor channel</text>
  <rect x="480" y="25" width="290" height="60" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="625" y="51" text-anchor="middle" fill="#222" font-weight="bold">6. Status</text>
  <text x="625" y="67" text-anchor="middle" fill="#222">in the request header</text>
  <rect x="30" y="140" width="160" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="110" y="168" text-anchor="middle" fill="#222" font-weight="bold">1. Tracker locked?</text>
  <text x="110" y="184" text-anchor="middle" fill="#222">the memory policy</text>
  <text x="110" y="200" text-anchor="middle" fill="#222">snapshot locks it</text>
  <rect x="250" y="140" width="160" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="330" y="168" text-anchor="middle" fill="#222" font-weight="bold">2. Check the GUID</text>
  <text x="330" y="184" text-anchor="middle" fill="#222">and the range;</text>
  <text x="330" y="200" text-anchor="middle" fill="#222">no MMRAM overlap</text>
  <rect x="470" y="140" width="160" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="550" y="168" text-anchor="middle" fill="#222" font-weight="bold">3. Track the range</text>
  <text x="550" y="184" text-anchor="middle" fill="#222">an identical repeat</text>
  <text x="550" y="200" text-anchor="middle" fill="#222">needs no remap</text>
  <rect x="660" y="140" width="110" height="80" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="715" y="168" text-anchor="middle" fill="#222" font-weight="bold">Unblocked</text>
  <text x="715" y="184" text-anchor="middle" fill="#222">memory</text>
  <text x="715" y="200" text-anchor="middle" fill="#222">tracker</text>
  <rect x="470" y="300" width="160" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="550" y="320" text-anchor="middle" fill="#222" font-weight="bold">4. Map the pages</text>
  <text x="550" y="336" text-anchor="middle" fill="#222">not present yet:</text>
  <text x="550" y="352" text-anchor="middle" fill="#222">W, NX; S if</text>
  <text x="550" y="368" text-anchor="middle" fill="#222">EFI_MEMORY_SP</text>
  <rect x="660" y="300" width="110" height="80" rx="5" fill="#ffffff" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="715" y="336" text-anchor="middle" fill="#222" font-weight="bold">Page</text>
  <text x="715" y="352" text-anchor="middle" fill="#222">table</text>
  <rect x="30" y="300" width="260" height="80" rx="5" fill="#fde2e1" stroke="#d9534f" stroke-width="1.5"/>
  <text x="160" y="320" text-anchor="middle" fill="#222" font-weight="bold">Refused</text>
  <text x="160" y="336" text-anchor="middle" fill="#222">locked: ACCESS_DENIED</text>
  <text x="160" y="352" text-anchor="middle" fill="#222">invalid: INVALID_PARAMETER</text>
  <text x="160" y="368" text-anchor="middle" fill="#222">overlap: SECURITY_VIOLATION</text>
  <polyline points="165,85 165,140" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="141" y="92" width="48" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="165" y="114" text-anchor="middle" fill="#222">MMI</text>
  <polyline points="190,180 250,180" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="174" text-anchor="middle" fill="#2d6a4f" font-size="11">unlocked</text>
  <polyline points="410,180 470,180" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="174" text-anchor="middle" fill="#2d6a4f" font-size="11">valid</text>
  <polyline points="630,180 660,180" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>
  <polyline points="550,220 550,300" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="558" y="264" text-anchor="start" fill="#555" font-size="11">new range</text>
  <polyline points="630,340 660,340" fill="none" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-grey)"/>
  <text x="560" y="399" text-anchor="middle" fill="#555" font-size="11">on failure: unmap and untrack</text>
  <polyline points="80,220 80,300" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="88" y="244" text-anchor="start" fill="#c0392b" font-size="11">locked</text>
  <polyline points="330,220 330,255 170,255 170,300" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="338" y="235" text-anchor="start" fill="#c0392b" font-size="11">invalid GUID or range,</text>
  <text x="338" y="249" text-anchor="start" fill="#c0392b" font-size="11">or overlaps MMRAM</text>
  <polyline points="495,220 495,275 250,275 250,300" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="445" y="290" text-anchor="end" fill="#c0392b" font-size="11">overlaps a tracked range</text>
  <polyline points="630,362 640,362" fill="none" stroke="#222" stroke-width="1.5"/>
  <polyline points="145,380 145,405 640,405" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <polyline points="640,405 640,85" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="604" y="92" width="72" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="640" y="114" text-anchor="middle" fill="#222">status</text>
</svg>
