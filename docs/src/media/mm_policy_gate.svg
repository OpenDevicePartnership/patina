<svg xmlns="http://www.w3.org/2000/svg" width="800" height="432" viewBox="0 0 800 432" font-family="monospace" font-size="13">
  <title>Policy gate checks on a syscall</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="432" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="280" fill="#fff3cc"/>
  <rect x="10" y="290" width="780" height="132" fill="#f0f0f0"/>
  <line x1="10" y1="290" x2="790" y2="290" stroke="#999" stroke-dasharray="6 4"/>
  <text x="20" y="32" text-anchor="start" fill="#7a5a00" font-weight="bold">Ring 0: mm_supervisor.efi</text>
  <text x="20" y="412" text-anchor="start" fill="#555" font-weight="bold">Ring 3: mm_user_core.efi and MM drivers</text>
  <!-- The three checks, left to right -->
  <rect x="30" y="50" width="170" height="100" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" fill="#222" font-weight="bold">2. Well formed?</text>
  <text x="115" y="96" text-anchor="middle" fill="#222">no Execute on an</text>
  <text x="115" y="112" text-anchor="middle" fill="#222">MSR or I/O port;</text>
  <text x="115" y="128" text-anchor="middle" fill="#222">port at most 0xFFFF</text>
  <rect x="240" y="50" width="170" height="100" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="325" y="80" text-anchor="middle" fill="#222" font-weight="bold">3. Root for type?</text>
  <text x="325" y="96" text-anchor="middle" fill="#222">none: deny, except</text>
  <text x="325" y="112" text-anchor="middle" fill="#222">save state, which</text>
  <text x="325" y="128" text-anchor="middle" fill="#222">is allowed</text>
  <rect x="450" y="50" width="170" height="100" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="535" y="80" text-anchor="middle" fill="#222" font-weight="bold">4. Match the list</text>
  <text x="535" y="96" text-anchor="middle" fill="#222">allow list: match</text>
  <text x="535" y="112" text-anchor="middle" fill="#222">deny list: no match</text>
  <text x="535" y="128" text-anchor="middle" fill="#222">other list: deny</text>
  <rect x="660" y="50" width="110" height="100" rx="5" fill="#d8f3dc" stroke="#52b788" stroke-width="1.5"/>
  <text x="715" y="88" text-anchor="middle" fill="#222" font-weight="bold">5. Allowed</text>
  <text x="715" y="104" text-anchor="middle" fill="#222">the handler</text>
  <text x="715" y="120" text-anchor="middle" fill="#222">performs it</text>
  <polyline points="200,100 240,100" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="92" text-anchor="middle" fill="#2d6a4f" font-size="11">yes</text>
  <polyline points="410,100 450,100" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="92" text-anchor="middle" fill="#2d6a4f" font-size="11">yes</text>
  <polyline points="620,100 660,100" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="92" text-anchor="middle" fill="#2d6a4f" font-size="11">yes</text>
  <!-- Any failed check denies -->
  <rect x="450" y="180" width="170" height="76" rx="5" fill="#fde2e1" stroke="#d9534f" stroke-width="1.5"/>
  <text x="535" y="198" text-anchor="middle" fill="#222" font-weight="bold">5. Denied</text>
  <text x="535" y="214" text-anchor="middle" fill="#222">halt in Ring 0;</text>
  <text x="535" y="230" text-anchor="middle" fill="#222">a save state read</text>
  <text x="535" y="246" text-anchor="middle" fill="#222">gets an error</text>
  <polyline points="115,150 115,218 450,218" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <polyline points="325,150 325,218" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <polyline points="535,150 535,180" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="130" y="174" text-anchor="middle" fill="#c0392b" font-size="11">no</text>
  <text x="340" y="174" text-anchor="middle" fill="#c0392b" font-size="11">no</text>
  <text x="550" y="170" text-anchor="middle" fill="#c0392b" font-size="11">no</text>
  <!-- Ring 3 and the two transitions -->
  <rect x="30" y="330" width="230" height="62" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="145" y="349" text-anchor="middle" fill="#222" font-weight="bold">1. Gated syscall</text>
  <text x="145" y="365" text-anchor="middle" fill="#222">RdMsr, WrMsr, IoRead,</text>
  <text x="145" y="381" text-anchor="middle" fill="#222">IoWrite, Cli, Wbinvd, ...</text>
  <rect x="560" y="330" width="210" height="62" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="665" y="349" text-anchor="middle" fill="#222" font-weight="bold">6. Result in RAX</text>
  <text x="665" y="365" text-anchor="middle" fill="#222">the value, or the</text>
  <text x="665" y="381" text-anchor="middle" fill="#222">save state error</text>
  <rect x="40" y="272" width="80" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="80" y="294" text-anchor="middle" fill="#222" font-weight="bold">syscall</text>
  <polyline points="80,330 80,308" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="80,272 80,150" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="675" y="272" width="80" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="715" y="294" text-anchor="middle" fill="#222" font-weight="bold">sysretq</text>
  <polyline points="735,150 735,272" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="735,308 735,330" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="620,240 692,240 692,272" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <polyline points="692,308 692,330" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="652" y="260" text-anchor="middle" fill="#c0392b" font-size="11">save state</text>
</svg>
