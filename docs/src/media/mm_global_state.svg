<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="monospace" font-size="13">
  <title>MM supervisor global state</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="560" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="540" fill="#fff3cc"/>
  <!-- The two stores -->
  <rect x="290" y="40" width="220" height="210" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="400" y="117" text-anchor="middle" fill="#222" font-weight="bold">InitState</text>
  <text x="400" y="133" text-anchor="middle" fill="#444"></text>
  <text x="400" y="149" text-anchor="middle" fill="#444">init progress</text>
  <text x="400" y="165" text-anchor="middle" fill="#444">user entry point</text>
  <text x="400" y="181" text-anchor="middle" fill="#444">runtime flag</text>
  <rect x="290" y="276" width="220" height="216" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#222" font-weight="bold">SecurityState</text>
  <text x="400" y="364" text-anchor="middle" fill="#444"></text>
  <text x="400" y="380" text-anchor="middle" fill="#444">policy gate</text>
  <text x="400" y="396" text-anchor="middle" fill="#444">page table, allocators</text>
  <text x="400" y="412" text-anchor="middle" fill="#444">unblocked memory</text>
  <text x="400" y="428" text-anchor="middle" fill="#444">comm buffers, save state</text>
  <!-- Modules on the left -->
  <rect x="30" y="40" width="200" height="72" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="130" y="56" text-anchor="middle" fill="#222" font-weight="bold">mmcore::entry</text>
  <text x="130" y="72" text-anchor="middle" fill="#222">marks the BSP done</text>
  <text x="130" y="88" text-anchor="middle" fill="#222">and each core</text>
  <text x="130" y="104" text-anchor="middle" fill="#222">initialized</text>
  <line x1="230" y1="76" x2="290" y2="76" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="30" y="160" width="200" height="142" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="130" y="211" text-anchor="middle" fill="#222" font-weight="bold">mmcore::init</text>
  <text x="130" y="227" text-anchor="middle" fill="#222">BSP initialization</text>
  <text x="130" y="243" text-anchor="middle" fill="#222">fills both stores,</text>
  <text x="130" y="259" text-anchor="middle" fill="#222">each value once</text>
  <line x1="230" y1="190" x2="290" y2="190" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="290" x2="290" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="30" y="380" width="200" height="72" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="130" y="404" text-anchor="middle" fill="#222" font-weight="bold">hob, memory, policy</text>
  <text x="130" y="420" text-anchor="middle" fill="#222">validation and</text>
  <text x="130" y="436" text-anchor="middle" fill="#222">page table walks</text>
  <line x1="230" y1="416" x2="290" y2="416" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <!-- Modules on the right -->
  <rect x="570" y="40" width="200" height="72" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="670" y="64" text-anchor="middle" fill="#222" font-weight="bold">handlers::system</text>
  <text x="670" y="80" text-anchor="middle" fill="#222">Exit Boot Services</text>
  <text x="670" y="96" text-anchor="middle" fill="#222">sets at runtime</text>
  <line x1="570" y1="76" x2="510" y2="76" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="160" width="200" height="142" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="670" y="211" text-anchor="middle" fill="#222" font-weight="bold">mmcore::runtime</text>
  <text x="670" y="227" text-anchor="middle" fill="#222">reads the user entry,</text>
  <text x="670" y="243" text-anchor="middle" fill="#222">the runtime flag and</text>
  <text x="670" y="259" text-anchor="middle" fill="#222">the comm buffers</text>
  <line x1="510" y1="190" x2="570" y2="190" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="290" x2="570" y2="290" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="330" width="200" height="72" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="670" y="354" text-anchor="middle" fill="#222" font-weight="bold">supv_request</text>
  <text x="670" y="370" text-anchor="middle" fill="#222">unblock memory,</text>
  <text x="670" y="386" text-anchor="middle" fill="#222">fetch policy</text>
  <line x1="570" y1="366" x2="510" y2="366" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="570" y="420" width="200" height="72" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="670" y="444" text-anchor="middle" fill="#222" font-weight="bold">privilege_mgmt</text>
  <text x="670" y="460" text-anchor="middle" fill="#222">syscalls, save</text>
  <text x="670" y="476" text-anchor="middle" fill="#222">state reads</text>
  <line x1="570" y1="456" x2="510" y2="456" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="20" y="540" text-anchor="start" fill="#7a5a00" font-weight="bold">Ring 0: patina_mm_supervisor</text>
</svg>
