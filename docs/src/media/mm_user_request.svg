<svg xmlns="http://www.w3.org/2000/svg" width="800" height="370" viewBox="0 0 800 370" font-family="monospace" font-size="13">
  <title>A UserRequest in the user core</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="370" rx="8" fill="#ffffff"/>
  <rect x="10" y="10" width="780" height="160" fill="#fff3cc"/>
  <text x="20" y="30" text-anchor="start" fill="#7a5a00" font-weight="bold">Ring 0: mm_supervisor.efi, BSP</text>
  <rect x="10" y="170" width="780" height="190" fill="#f0f0f0"/>
  <text x="20" y="350" text-anchor="start" fill="#555" font-weight="bold">Ring 3: mm_user_core.efi, BSP</text>
  <line x1="10" y1="170" x2="790" y2="170" stroke="#999" stroke-dasharray="6 4"/>
  <rect x="30" y="44" width="170" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="115" y="80" text-anchor="middle" fill="#222" font-weight="bold">1. Demote with</text>
  <text x="115" y="96" text-anchor="middle" fill="#222">UserRequest</text>
  <rect x="220" y="44" width="170" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="305" y="64" text-anchor="middle" fill="#222" font-weight="bold">MmIsCommBuffer</text>
  <text x="305" y="80" text-anchor="middle" fill="#222">confirms the</text>
  <text x="305" y="96" text-anchor="middle" fill="#222">internal buffer</text>
  <text x="305" y="112" text-anchor="middle" fill="#222">range</text>
  <rect x="600" y="44" width="170" height="80" rx="5" fill="#fde3a0" stroke="#b08a2e" stroke-width="1.5"/>
  <text x="685" y="72" text-anchor="middle" fill="#222" font-weight="bold">6. Copy the</text>
  <text x="685" y="88" text-anchor="middle" fill="#222">buffer out; check</text>
  <text x="685" y="104" text-anchor="middle" fill="#222">the response size</text>
  <rect x="30" y="220" width="170" height="90" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="115" y="253" text-anchor="middle" fill="#222" font-weight="bold">2. Copy the core</text>
  <text x="115" y="269" text-anchor="middle" fill="#222">context into the</text>
  <text x="115" y="285" text-anchor="middle" fill="#222">MM System Table</text>
  <rect x="220" y="220" width="170" height="90" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="305" y="245" text-anchor="middle" fill="#222" font-weight="bold">3. Sync only:</text>
  <text x="305" y="261" text-anchor="middle" fill="#222">ask Ring 0 to</text>
  <text x="305" y="277" text-anchor="middle" fill="#222">confirm the</text>
  <text x="305" y="293" text-anchor="middle" fill="#222">buffer</text>
  <rect x="410" y="220" width="170" height="90" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="495" y="245" text-anchor="middle" fill="#222" font-weight="bold">4. Sync only:</text>
  <text x="495" y="261" text-anchor="middle" fill="#222">check the header</text>
  <text x="495" y="277" text-anchor="middle" fill="#222">and sizes; run the</text>
  <text x="495" y="293" text-anchor="middle" fill="#222">GUID handlers</text>
  <rect x="600" y="220" width="170" height="90" rx="5" fill="#e6e6e6" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="685" y="245" text-anchor="middle" fill="#222" font-weight="bold">5. Every MMI:</text>
  <text x="685" y="261" text-anchor="middle" fill="#222">run the root</text>
  <text x="685" y="277" text-anchor="middle" fill="#222">handlers; write</text>
  <text x="685" y="293" text-anchor="middle" fill="#222">status and size</text>
  <polyline points="160,124 160,152" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="160,188 160,220" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="124" y="152" width="72" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="160" y="174" text-anchor="middle" fill="#222">demote</text>
  <polyline points="255,220 255,188" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="255,152 255,124" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="215" y="152" width="80" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="255" y="174" text-anchor="middle" fill="#222">syscall</text>
  <polyline points="355,124 355,152" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="355,188 355,220" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="315" y="152" width="80" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="355" y="174" text-anchor="middle" fill="#222">sysretq</text>
  <polyline points="200,265 220,265" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="390,265 410,265" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="580,265 600,265" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="685,220 685,188" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="685,152 685,124" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="637" y="152" width="96" height="36" rx="5" fill="#d4d4d4" stroke="#6b6b6b" stroke-width="1.5"/>
  <text x="685" y="174" text-anchor="middle" fill="#222">call gate</text>
  <text x="770" y="338" text-anchor="end" fill="#555" font-size="11">dashed: only when a synchronous request is present</text>
</svg>
