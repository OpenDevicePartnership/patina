[package]
name = "patina_dxe_core"
version.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
readme = "README.md"
description = "A pure rust implementation of the UEFI DXE Core."
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
bitfield-struct = { workspace = true }
cfg-if = { workspace = true }
goblin = { workspace = true, features = ["pe32", "pe64", "te"] }
linked_list_allocator = { workspace = true }
log = { workspace = true }
patina_paging = { workspace = true }
scroll = { workspace = true, features = ["derive"] }
spin = { workspace = true }
uuid = { workspace = true  }
patina = { workspace = true, features = ["core"] }
patina_ffs = { workspace = true }
patina_internal_core = { workspace = true }
patina_internal_cpu = { workspace = true }
patina_debugger = { workspace = true, features = ["alloc"] }
patina_test = { workspace = true }

[dev-dependencies]
# To avoid circular dependencies, cargo-release skips dev dependencies when evaluating the release order for
# cargo-release, however they are still used when verifying the package is compileable. Any dev-dependency that is
# local to the workspace should be added via `path` instead of `workspace = true` so that that it does not fail to
# compile due to the dev-dependency not being published yet.
patina_samples = { path = "../components/patina_samples" }
patina = { path = "../sdk/patina", features = ["core", "mockall"] }
patina_ffs_extractors = { path = "../sdk/patina_ffs_extractors" }
patina_internal_core = { path = "../core/patina_internal_core" }
env_logger = { workspace = true }
mockall = { workspace = true }
serial_test = { workspace = true }
zerocopy = { workspace = true }
zerocopy-derive = { workspace = true }

[target.'cfg(all(target_arch="aarch64"))'.dependencies]
arm-gic = { workspace = true }

# corosensei does not currently support aarch64-pc-windows-msvc: https://github.com/Amanieu/corosensei/issues/29.
# Excluding it for that one host target lets patina_dxe_core still build/lint/test natively on
# Windows-on-Arm hosts. Actual UEFI targets (x86_64-unknown-uefi, aarch64-unknown-uefi) are
# unaffected since their target_os is "uefi", not "windows".
[target.'cfg(not(all(target_arch = "aarch64", target_os = "windows")))'.dependencies]
corosensei = { workspace = true }

[features]
compatibility_mode_allowed = []
confidential_compute = []
debugger_reload = []
default = []
std = ["patina/std"]
v1_resource_descriptor_support = []
# All non-std features to test in CI
ci_features = ["compatibility_mode_allowed", "confidential_compute", "debugger_reload", "v1_resource_descriptor_support"]
